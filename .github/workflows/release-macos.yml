name: Release macOS

# Releases Un.app for macOS (Apple silicon) on its own (alpha: built and smoke-tested on a GitHub
# runner, signed with Developer ID, notarised and stapled): the tag (release-tag.yml) → the build →
# the zip attached to the tag's GitHub Release.
#
#   gh workflow run "Release macOS"                # a new release: the next patch, from main
#   gh workflow run "Release macOS" -f tag=v0.1.9  # build v0.1.9 and attach to its release
#
# Same contents as the Windows build (apps/un with the unmath lessons, the toy detector, Whisper
# small, Piper voices); see release-windows.yml for the licences.
#
# Secrets (sealsbroken org, granted to this repo):
#   MACOS_CERT_P12        the "Developer ID Application: Onym OU (7C7LXXWRMG)" certificate and its
#                         key, a .p12 in base64
#   MACOS_CERT_PASSWORD   the .p12's password
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT   the App Store Connect API key, for notarytool

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag: blank = the next patch of the latest v* tag (a new release from this commit); an existing tag = build it and attach'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # upload the zip to the release

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  tag:
    name: Version
    uses: ./.github/workflows/release-tag.yml
    with:
      tag: ${{ inputs.tag }}
      platform: macOS (Apple silicon)
    permissions:
      contents: write

  macos:
    name: Build, smoke-test and attach
    needs: tag
    runs-on: macos-latest
    timeout-minutes: 240   # notarisation can wait up to 3h
    steps:
      - uses: actions/checkout@v4
        with:
          path: unengine
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        working-directory: unengine
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::No tag $TAG"; exit 1; }
          # The packaging (Info.plist, icon, entitlements) comes from this workflow's commit, so an
          # older tag can be packaged too.
          cp -R apps/un/macos "$RUNNER_TEMP/macos"
          git checkout -q "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sealsbroken/unmath
          path: unmath

      - uses: dtolnay/rust-toolchain@stable
      # No build cache: a restored target dir once left ort-sys linking a missing cargs.lib.
      - name: Build
        run: cargo build --release --manifest-path unengine/apps/un/Cargo.toml

      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Only the team's Developer ID Application certificate can be notarised (an Apple Development
          # or Distribution one signs fine and is rejected later).
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*(7C7LXXWRMG)"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity for team 7C7LXXWRMG in MACOS_CERT_P12"; exit 1; }
          echo "Signing with: $identity"
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download models-v1 -R ${{ github.repository }} -p 'toys.*' -D unengine/models --clobber
          python3 unengine/tools/fetch_models.py --whisper small

      - name: Assemble and sign Un.app
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"$VERSION"
          build_number=$((major * 10000 + minor * 100 + patch))
          app=dist/Un-$VERSION-macos-arm64/Un.app
          build=unengine/apps/un/target/release
          models=unengine/models
          mac=$RUNNER_TEMP/macos
          # The executables find the libraries in ../Frameworks and the models in ../Resources/models
          # (apps/un/build.rs, un_app::ModelPaths).
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources/models/speech"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__BUILD__/$build_number/" "$mac/Info.plist" > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          cp "$mac/Un.icns" "$app/Contents/Resources/"
          cp "$build/un" "$build/un-cli" "$app/Contents/MacOS/"
          cp -a "$build"/*.dylib "$app/Contents/Frameworks/"
          res="$app/Contents/Resources/models"
          cp "$models/toys.onnx" "$models/toys.json" "$res/"
          cp "$models/speech/silero_vad.onnx" "$res/speech/"
          for voice in vits-piper-ru_RU-irina-medium vits-piper-en_US-ljspeech-medium; do
            cp -R "$models/speech/$voice" "$res/speech/"
          done
          whisper=sherpa-onnx-whisper-small
          mkdir -p "$res/speech/$whisper"
          cp "$models/speech/$whisper"/*int8* "$models/speech/$whisper"/*tokens* "$res/speech/$whisper/"
          # Developer ID with the hardened runtime and a timestamp, as notarisation requires, inside
          # out: the libraries, the command line, then the bundle (its main executable gets the
          # camera and microphone entitlements, the resources get sealed).
          sign() { codesign --force --options runtime --timestamp --sign "$IDENTITY" "$@"; }
          for f in "$app/Contents/Frameworks"/*.dylib; do [ -L "$f" ] || sign "$f"; done
          sign --entitlements "$mac/un.entitlements" "$app/Contents/MacOS/un-cli"
          sign --entitlements "$mac/un.entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee signature.txt
          grep -q '^Authority=Developer ID Application: .*(7C7LXXWRMG)$' signature.txt
          grep -q '^TeamIdentifier=7C7LXXWRMG$' signature.txt
          grep -q '^Timestamp=' signature.txt
          rm signature.txt
          du -sh "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Smoke tests (no camera, no microphone, no speakers)
        run: |
          set -euo pipefail
          # From a scratch directory, without --models: the bundle must find its own models.
          cli="$PWD/$APP/Contents/MacOS/un-cli"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          "$cli" strategies | tee strategies.txt
          grep -q '^unmath-count-to-three' strategies.txt && ! grep -q '^demo' strategies.txt
          "$cli" lesson --sim 1 --strategy unmath-count-to-three --language ru \
            --voice console --mic off --answers "лес,один" --frames 120 | tee lesson.txt
          grep -q 'tutor: ' lesson.txt
          "$cli" check-speech --language ru
          "$cli" check-speech --language en
          python3 - <<'PY'
          # A wooden table with one yellow toy, as a binary PPM; sips makes it a JPEG.
          w, h = 640, 480
          px = bytearray()
          for y in range(h):
              for x in range(w):
                  px += bytes((240, 190, 40)) if (x - 320) ** 2 + (y - 240) ** 2 < 60 ** 2 else bytes((196, 138, 82))
          open("table.ppm", "wb").write(b"P6 %d %d 255\n" % (w, h) + bytes(px))
          PY
          sips -s format jpeg table.ppm --out table.jpg >/dev/null
          "$cli" run --source table.jpg --frames 3 | tee detector.txt
          grep -q '"raw"' detector.txt
          # The tests ran the signed bundle; it must still be intact.
          codesign --verify --deep --strict "$GITHUB_WORKSPACE/$APP"

      - name: Notarise and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_CONTENT" > "$key"
          submission="$RUNNER_TEMP/Un-notarise.zip"
          ditto -c -k --keepParent "$APP" "$submission"
          # Submit, then wait: in JSON mode notarytool prints nothing until it returns, so the ID goes
          # into the log as soon as the upload is done (check it with notarytool info <id>). Apple can
          # take hours on a first or large submission.
          xcrun notarytool submit "$submission" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --output-format json | tee submit.json
          id=$(python3 -c 'import json; print(json.load(open("submit.json"))["id"])')
          echo "Submission ID: $id"
          xcrun notarytool wait "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --timeout 3h --output-format json | tee notary.json
          status=$(python3 -c 'import json; print(json.load(open("notary.json"))["status"])')
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Notarisation: $status"; exit 1
          fi
          # The ticket goes into the app, so it opens offline too.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP"
          rm -f "$key" submit.json notary.json "$submission"

      - name: README and zip
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          UNMATH=$(git -C unmath rev-parse HEAD)
          cat > "dist/Un-$VERSION-macos-arm64/README.txt" <<README
          Un ${VERSION} for macOS (Apple silicon, alpha)

          Un teaches children to count with real toys on a table: the camera counts the toys, a voice
          tutor leads the lesson, the child answers by voice.

          ALPHA: built and smoke-tested automatically; signed with Developer ID and notarised by
          Apple. Drag Un.app to Applications and open it; allow the camera and microphone when asked.

          The command line is inside the app:

            /Applications/Un.app/Contents/MacOS/un-cli lesson --strategy unmath-count-to-three --language ru

          Settings and the children's progress are kept in ~/Library/Application Support/un.

          Source: https://github.com/sealsbroken/unengine (${TAG}) and
          https://github.com/sealsbroken/unmath (${UNMATH}). The engine and lessons are LGPL-3.0;
          the bundled Piper voices use espeak-ng (GPL-3.0), so this bundle as a whole is GPL-3.0.
          README
          (cd dist && ditto -c -k --keepParent "Un-${VERSION}-macos-arm64" "Un-${VERSION}-macos-arm64-alpha.zip")
          ls -la dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        working-directory: unengine
        run: |
          set -euo pipefail
          zip="../dist/Un-${VERSION}-macos-arm64-alpha.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Un ${VERSION}" --notes "Un ${VERSION}."
          fi
          gh release upload "$TAG" "$zip" --clobber
          # The macOS line of the notes, replacing an older one (a re-run).
          gh release view "$TAG" --json body --jq .body | grep -v '^\*\*macOS (alpha)\*\*' > notes.md || true
          printf '\n**macOS (alpha)**: Un-%s-macos-arm64-alpha.zip, Apple silicon, built and smoke-tested on a GitHub runner, Un.app signed with Developer ID and notarised (see its README).\n' "$VERSION" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Remove the signing keychain
        if: always()
        run: '[ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN"'
