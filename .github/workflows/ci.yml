name: ci

# Manual only: run it from the Actions tab ("Run workflow"). Nothing fires on push or pull request.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - name: Speech self-test (models downloaded, no audio device needed)
        if: runner.os != 'Windows'
        run: |
          python3 tools/fetch_models.py --speech --language en
          cargo run -p un-cli -- check-speech --language en
      - name: Scripted lesson on the simulated table
        run: cargo run -p un-cli -- lesson --sim 3 --answers 3,2 --voice console --tasks 2 --seed 1 --nudge 30
