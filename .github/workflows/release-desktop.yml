name: Release Desktop

# Cuts a desktop release of Un without an iOS build: the version from the tag (as Release iOS and
# onym-ios: blank = the next patch of the latest v* tag) → the tag and a GitHub Release → the
# Windows x64 and macOS (Apple silicon) alphas, built, smoke-tested and attached
# (release-windows.yml, release-macos.yml).
#
#   gh workflow run "Release Desktop"
#   gh workflow run "Release Desktop" -f tag=v0.2.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.9); leave blank for the next patch of the latest v* tag'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      marketing: ${{ steps.version.outputs.MARKETING_VERSION }}
      build: ${{ steps.version.outputs.CURRENT_PROJECT_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The v* tag history: `fetch-tags: true` alone (with the default depth 1) does not
          # populate refs/tags.
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG// /}"
          if [ -z "$TAG" ]; then
            # Next patch of the latest reachable v-tag (vMAJOR.MINOR.PATCH only).
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              REMOTE_LATEST=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | grep -v '\^{}' \
                                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
              if [ -n "$REMOTE_LATEST" ]; then
                echo "::error::No v* tags here but the remote has $REMOTE_LATEST: the tag fetch failed. Refusing to start over at v0.0.1."
                exit 1
              fi
              TAG="v0.0.1"
              echo "::notice::No v* tags yet; starting at $TAG"
            else
              IFS='.' read -r MAJ MIN PAT <<< "${LATEST#v}"
              TAG="v${MAJ}.${MIN}.$((PAT + 1))"
              echo "::notice::No tag given; ${LATEST} → ${TAG}"
            fi
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (App Store versions are numeric)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a higher version or leave the tag blank."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve version and build number
        id: version
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/resolve-release-version.sh | tee -a "$GITHUB_OUTPUT"
          echo "### ${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          scripts/resolve-release-version.sh | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag and GitHub Release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.marketing }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1 || true)
          RANGE=${PREV_TAG:+${PREV_TAG}..}HEAD
          {
            echo "Un ${VERSION} for the desktop: the Windows x64 and macOS (Apple silicon) alphas are attached below once built."
            echo ""
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release_notes.md

      - name: Create the tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Un ${{ needs.version.outputs.marketing }}
          body_path: release_notes.md

  windows:
    name: Windows alpha
    needs: [version, release]
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write

  macos:
    name: macOS alpha
    needs: [version, release]
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
