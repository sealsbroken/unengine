# XcodeGen project: `xcodegen generate` after building the Rust library (see README.md).
# The library is un-mobile (apps/mobile: the engine plus the unmath lessons), built by
# tools/ios.sh; for the engine alone with the demo strategy, build un-ffi and link -lun_ffi instead.
name: UnApp
options:
  bundleIdPrefix: app.onym.undigit
  deploymentTarget:
    iOS: "17.0"
targets:
  UnApp:
    type: application
    platform: iOS
    sources:
      - UnApp
      - Generated
      # App icon: drop a 1024x1024 PNG into Assets.xcassets/AppIcon.appiconset and name it in
      # its Contents.json ("filename": "Icon-1024.png").
      - Assets.xcassets
      # The models folder goes into the bundle as a folder reference: Bundle.main/models/*.onnx.
      - path: Resources/models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onym.undigit
        DEVELOPMENT_TEAM: 7C7LXXWRMG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: UnApp/Bridging.h
        # One Rust build per SDK, staged by tools/ios.sh (device and sim builds can coexist).
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Frameworks/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Frameworks/iphonesimulator
        # No -all_load: the prebuilt ONNX Runtime carries some objects twice, which would then
        # collide. Strategies are registered explicitly (un_mobile_init) instead.
        OTHER_LDFLAGS: ["-lun_mobile", "-lc++"]
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad, portrait, full screen
  # The same app as a native Mac app, for TestFlight and the Mac App Store: the same SwiftUI
  # screens (UnApp/Platform.swift holds the few differences), the same bundle ID, so it is one App
  # Store record (universal purchase) with a macOS platform. Sandboxed (UnMac.entitlements);
  # Apple silicon only, like the Rust library tools/ios.sh builds for it (`mac` modes).
  UnMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - UnApp
      - Generated
      - Assets.xcassets
      - path: Resources/models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Un
        PRODUCT_BUNDLE_IDENTIFIER: app.onym.undigit
        DEVELOPMENT_TEAM: 7C7LXXWRMG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: UnMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        INFOPLIST_FILE: Info-mac.plist
        SWIFT_OBJC_BRIDGING_HEADER: UnApp/Bridging.h
        ARCHS: arm64
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks/macosx
        OTHER_LDFLAGS: ["-lun_mobile", "-lc++"]
  # Synthetic lesson tests: the engine and the lessons through the Swift bindings, with a
  # scripted child and a simulated table, no host app (tools/ios.sh test).
  UnAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Generated
      - UnApp/NumberWords.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onym.undigit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: UnApp/Bridging.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Frameworks/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Frameworks/iphonesimulator
        OTHER_LDFLAGS: ["-lun_mobile", "-lc++"]
schemes:
  UnMac:
    build:
      targets:
        UnMac: all
    run:
      config: Debug
    archive:
      config: Release
  UnApp:
    build:
      targets:
        UnApp: all
        UnAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [UnAppTests]
