[package]
name = "un-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Un for macOS, Windows and Linux: the camera watches the table, the tutor talks, the child answers by voice or taps. Library plus a binary that ships the demo lesson."

[lib]
name = "un_desktop"
path = "src/lib.rs"

[[bin]]
name = "un-desktop"
path = "src/main.rs"

[features]
default = []
coreml = ["un-app/coreml"]
cuda = ["un-app/cuda"]
directml = ["un-app/directml"]

[dependencies]
un-core.workspace = true
un-engine.workspace = true
un-vision.workspace = true
un-media.workspace = true
un-app = { workspace = true, features = ["speech"] }
un-strategy-demo.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
parking_lot.workspace = true

# Linux: choosing X11 when the Wayland client library is missing (display.rs). The same winit as
# eframe's; only its X11 switch is used.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
libc = "0.2"
