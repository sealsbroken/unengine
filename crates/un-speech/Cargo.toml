[package]
name = "un-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Un's voice engine on sherpa-onnx: Zipformer recognisers with Silero VAD on the microphone, Piper voices for the tutor, all on-device."

[features]
default = ["audio"]
# Microphone and playback through cpal (desktop). Without it the crate only offers the model-level API.
audio = ["dep:cpal"]

[dependencies]
un-core.workspace = true
un-engine.workspace = true
sherpa-rs.workspace = true
cpal = { workspace = true, optional = true }
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
