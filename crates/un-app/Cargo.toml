[package]
name = "un-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Assembles an Un session on a desktop: finds models, builds speech in/out, runs perception, and drives the engine. Shared by the CLI, the desktop app and the FFI."

[features]
# The desktop voice engine (sherpa-onnx). Off for the mobile libraries, where speech is the platform's.
default = ["speech"]
speech = ["dep:un-speech"]
coreml = ["un-vision/coreml"]
cuda = ["un-vision/cuda"]
directml = ["un-vision/directml"]
# The on-device language model for the tutor's free answers (llama.cpp; needs cmake to build).
llm = ["dep:un-llm"]
# llama.cpp on Apple GPUs.
metal = ["llm", "un-llm/metal"]

[dependencies]
un-core.workspace = true
un-engine.workspace = true
un-vision.workspace = true
un-speech = { workspace = true, optional = true }
un-llm = { workspace = true, optional = true }
un-strategy-demo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
